# 流量账本 (liuliangzhangben.cc) VirtualHost 生产部署参考配置
# 适用于独立主机或 Docker Apache 容器

<VirtualHost *:80>
    ServerName liuliangzhangben.cc
    ServerAlias www.liuliangzhangben.cc
    ServerAdmin webmaster@liuliangzhangben.cc

    DocumentRoot /var/www/liuliangzhangben.cc/dist

    <Directory /var/www/liuliangzhangben.cc/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/liuliangzhangben_error.log
    CustomLog ${APACHE_LOG_DIR}/liuliangzhangben_access.log combined
</VirtualHost>

